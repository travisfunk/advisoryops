name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and test dependencies
        run: python -m pip install -e . pytest openpyxl
      - name: Check browser JavaScript syntax
        run: |
          node --check dashboard/sbom.js
          node --check dashboard/sbom-ui.js
      - name: Run offline regression suite
        run: python -m pytest tests/ -q
      - name: Install browser acceptance dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run browser acceptance checks
        run: npm run test:browser
      - name: Preserve browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-evidence
          path: outputs/uat/
          if-no-files-found: ignore
