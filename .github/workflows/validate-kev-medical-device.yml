name: Validate KEV Medical Device Correction

on:
  push:
    branches:
      - agent/fix-nightly-kev-catalog

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test runner
        run: |
          pip install -e .
          pip install pytest

      - name: Run focused KEV tests
        run: |
          pytest -q \
            tests/test_kev_medical_device_reconcile.py \
            tests/test_kev_full_catalog.py

      - name: Restore production discovery cache
        uses: actions/cache/restore@v4
        with:
          path: outputs/discover/
          key: discover-${{ runner.os }}-2026-08-15
          restore-keys: |
            discover-${{ runner.os }}-

      - name: Reconcile published feed against full KEV cache
        run: python -m advisoryops.kev_medical_device_reconcile

      - name: Verify full-catalog overlap after reconciliation
        run: python -m advisoryops.kev_full_catalog
